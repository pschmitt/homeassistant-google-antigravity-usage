# Google Gemini Usage Lovelace Cards Example
type: vertical-stack
cards:
  - type: heading
    heading: Google Gemini
    heading_style: subtitle
    icon: mdi:google
  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.google_gemini_antigravity_gemini_session_usage') | float(0) | round(0) }}%"
        secondary: Session
        icon: mdi:timer-sand
        entity: sensor.google_gemini_antigravity_gemini_session_usage
        icon_color: >-
          {%- set v = states('sensor.google_gemini_antigravity_gemini_session_usage') | float(0) -%}
          {%- set reset_ts = as_timestamp(states('sensor.google_gemini_antigravity_gemini_session_reset_time'), 0) -%}
          {%- set window = 18000 -%}
          {%- set remaining = [reset_ts - as_timestamp(now()), 0] | max -%}
          {%- set elapsed = [window - remaining, 1] | max -%}
          {%- set expected = [elapsed / window * 100, 10] | max -%}
          {%- set pace = v / expected if expected > 0 else 0 -%}
          {{ 'red' if v >= 90 or pace >= 3 else 'orange' if v >= 75 or pace >= 1.5 else 'yellow' if v >= 50 or pace >= 1.1 else 'green' }}
        tap_action:
          action: more-info
      - type: custom:timeflow-card
        style: classic-compact
        mode: count_down
        target_date: sensor.google_gemini_antigravity_gemini_session_reset_time
        title: Session reset
        show_days: false
        show_hours: true
        show_minutes: true
        show_seconds: false
        creation_date: "{{ (as_timestamp(states('sensor.google_gemini_antigravity_gemini_session_reset_time')) - 18000) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}"
        compact_format: true
        icon_size: 32
        tap_action:
          action: more-info
          entity: sensor.google_gemini_antigravity_gemini_session_reset_time
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.google_gemini_antigravity_gemini_weekly_usage') | float(0) | round(0) }}%"
        secondary: Weekly
        icon: mdi:calendar-week
        entity: sensor.google_gemini_antigravity_gemini_weekly_usage
        icon_color: >-
          {%- set v = states('sensor.google_gemini_antigravity_gemini_weekly_usage') | float(0) -%}
          {%- set reset_ts = as_timestamp(states('sensor.google_gemini_antigravity_gemini_weekly_reset_time'), 0) -%}
          {%- set window = 604800 -%}
          {%- set remaining = [reset_ts - as_timestamp(now()), 0] | max -%}
          {%- set elapsed = [window - remaining, 1] | max -%}
          {%- set expected = [elapsed / window * 100, 10] | max -%}
          {%- set pace = v / expected if expected > 0 else 0 -%}
          {{ 'red' if v >= 90 or pace >= 3 else 'orange' if v >= 75 or pace >= 1.5 else 'yellow' if v >= 50 or pace >= 1.1 else 'green' }}
        tap_action:
          action: more-info
      - type: custom:timeflow-card
        style: classic-compact
        mode: count_down
        target_date: sensor.google_gemini_antigravity_gemini_weekly_reset_time
        title: Weekly reset
        show_days: true
        show_hours: true
        show_minutes: false
        show_seconds: false
        creation_date: "{{ (as_timestamp(states('sensor.google_gemini_antigravity_gemini_weekly_reset_time')) - 604800) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}"
        compact_format: true
        icon_size: 32
        tap_action:
          action: more-info
          entity: sensor.google_gemini_antigravity_gemini_weekly_reset_time
